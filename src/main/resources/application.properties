# -------------------------------------------------------------
# SkyPulse Weather Application - Production Configuration
# -------------------------------------------------------------

# Server Configuration (Supports dynamic Cloud PORT binding)
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=weather-app

# HTTP Response Compression (GZIP for enhanced web performance)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Production Health Checks & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# JPA / H2 Database Settings (File-based persistence for saved locations)
spring.datasource.url=jdbc:h2:file:./data/weatherdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (Enabled for inspection, can be disabled via H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Cache Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=weatherCache,cityCache,airQualityCache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m

# Open-Meteo Weather Services Endpoints (Zero API-Key Required)
weather.api.forecast-url=https://api.open-meteo.com/v1/forecast
weather.api.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.api.air-quality-url=https://air-quality-api.open-meteo.com/v1/air-quality
weather.api.timeout-seconds=8

# Logging
logging.level.com.weather=INFO
logging.level.org.springframework.web=INFO
