# -------------------------------------------------------------
# SkyPulse Weather Application - Production Configuration
# -------------------------------------------------------------

# Server Configuration (Supports dynamic Cloud PORT binding)
server.port=${PORT:8080}
server.shutdown=graceful
spring.application.name=weather-app

# HTTP Response Compression (GZIP for enhanced web performance)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# Production Health Checks & Actuator
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.info.env.enabled=true

# Database Configuration (Supports local H2 & cloud production database via env vars)
spring.datasource.url=${SPRING_DATASOURCE_URL:${DATABASE_URL:jdbc:h2:file:./data/weatherdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${DATABASE_USERNAME:sa}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${DATABASE_PASSWORD:}}
spring.datasource.driverClassName=${SPRING_DATASOURCE_DRIVER_CLASS_NAME:${DATABASE_DRIVER:org.h2.Driver}}
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (Enabled by default, toggleable in production via H2_CONSOLE_ENABLED=false)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/h2-console

# Cache Configuration (Caffeine)
spring.cache.type=caffeine
spring.cache.cache-names=weatherCache,cityCache,airQualityCache
spring.cache.caffeine.spec=maximumSize=500,expireAfterWrite=15m

# Open-Meteo Weather Services Endpoints (Zero API-Key Required)
weather.api.forecast-url=${WEATHER_API_FORECAST_URL:https://api.open-meteo.com/v1/forecast}
weather.api.geocoding-url=${WEATHER_API_GEOCODING_URL:https://geocoding-api.open-meteo.com/v1/search}
weather.api.air-quality-url=${WEATHER_API_AIR_QUALITY_URL:https://air-quality-api.open-meteo.com/v1/air-quality}
weather.api.timeout-seconds=${WEATHER_API_TIMEOUT_SECONDS:8}

# Logging
logging.level.com.weather=INFO
logging.level.org.springframework.web=INFO
