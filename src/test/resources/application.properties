# Test Configuration (Fast In-Memory Database)
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Cache
spring.cache.type=caffeine
spring.cache.cache-names=weatherCache,cityCache,airQualityCache

# Test endpoints
weather.api.forecast-url=https://api.open-meteo.com/v1/forecast
weather.api.geocoding-url=https://geocoding-api.open-meteo.com/v1/search
weather.api.air-quality-url=https://air-quality-api.open-meteo.com/v1/air-quality
weather.api.timeout-seconds=8

management.endpoints.web.exposure.include=health,info
